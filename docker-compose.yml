name: memora

services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    init: true
    ports:
      - "8000:8000"
    env_file:
      - path: apps/backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/memora
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-memora123}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  worker:
    # LiveKit agent worker (A.3 realtime). Separate process from the API — the
    # livekit-agent worker runs its own event loop + connects to LiveKit, so it can't
    # share the uvicorn process. Same image, different command + env (needs LiveKit keys).
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    init: true
    command: ["python", "-m", "workers.livekit_worker", "start"]
    env_file:
      - path: apps/backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/memora
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-memora123}
      # LiveKit + Gemini must come from .env (or the real deploy env) — the worker
      # cannot start without LIVEKIT_URL / LIVEKIT_API_KEY / LIVEKIT_API_SECRET.
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-dummy}
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:18
    container_name: memora-postgres
    environment:
      POSTGRES_DB: memora
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - memora_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  neo4j:
    image: neo4j:5
    container_name: memora-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-memora123}
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - memora_neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null -q http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  memora_postgres_data:
  memora_neo4j_data:
