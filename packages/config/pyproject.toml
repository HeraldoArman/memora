[project]
name = "memora-config"
version = "0.1.0"
description = "Memora config — railway, docker, env presets."
requires-python = ">=3.12"
dependencies = [
  "pydantic-settings==2.14.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["railway", "docker", "env"]