[project]
name = "memora-shared"
version = "0.1.0"
description = "Memora shared — constants, DTOs, schemas, prompts, utils."
requires-python = ">=3.12"
dependencies = [
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["constants", "dto", "schemas", "prompts", "utils"]