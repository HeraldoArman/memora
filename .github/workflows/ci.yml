name: CI

on:
  push:
  pull_request:
  
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install ruff
        run: uv sync --no-install-project --only-group dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install prettier
        run: bun install --frozen-lockfile

      - name: Prettier check
        run: bunx prettier --check .

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Sync Python workspace
        run: uv sync --locked --all-packages

      - name: Build Python packages
        run: bunx nx run-many -t build --exclude=tag:firmware

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    env:
      # dummy values satisfy Settings validation (no live services needed)
      LIVEKIT_URL: wss://ci.livekit.cloud
      LIVEKIT_API_KEY: dummy
      LIVEKIT_API_SECRET: dummy
      GEMINI_API_KEY: dummy
      DATABASE_URL: postgresql://postgres:password@localhost:5432/memora
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: memora123
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync Python workspace
        run: uv sync --locked --all-packages

      - name: Run unit tests
        run: uv run pytest apps/backend/tests/unit/

  migration-test:
    name: Migration Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: memora
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # dummy values satisfy Settings validation; DB vars point at the service container
      LIVEKIT_URL: wss://ci.livekit.cloud
      LIVEKIT_API_KEY: dummy
      LIVEKIT_API_SECRET: dummy
      GEMINI_API_KEY: dummy
      DATABASE_URL: postgresql://postgres:password@localhost:5432/memora
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: memora123
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync Python workspace
        run: uv sync --locked --all-packages

      - name: Run migrations (alembic upgrade head)
        working-directory: packages/database
        run: uv run alembic upgrade head

      - name: Verify schema matches head revision
        working-directory: apps/backend
        run: uv run python scripts/verify/migration.py

  integration-test:
    name: DB Integration Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: memora
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: neo4j/memora123
          NEO4J_PLUGINS: '["apoc"]'
        ports:
          - 7474:7474
          - 7687:7687
        options: >-
          --health-cmd "wget -O /dev/null -q http://localhost:7474 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 20s
    env:
      LIVEKIT_URL: wss://ci.livekit.cloud
      LIVEKIT_API_KEY: dummy
      LIVEKIT_API_SECRET: dummy
      GEMINI_API_KEY: dummy
      DATABASE_URL: postgresql://postgres:password@localhost:5432/memora
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: memora123
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync Python workspace
        run: uv sync --locked --all-packages

      - name: Run migrations (alembic upgrade head)
        working-directory: packages/database
        run: uv run alembic upgrade head

      - name: Run DB integration test (Postgres + Neo4j + FAISS)
        working-directory: apps/backend
        run: uv run python scripts/verify/db_integration.py

      - name: Run service integration tests (pytest)
        run: uv run pytest apps/backend/tests/integration/

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: false
          tags: memora-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  dashboard-build:
    name: Dashboard Build
    runs-on: ubuntu-latest
    env:
      # dummy values satisfy the dashboard zod env validation at build time
      LIVEKIT_URL: wss://ci.livekit.cloud
      LIVEKIT_API_KEY: dummy
      LIVEKIT_API_SECRET: dummy
      NEXT_PUBLIC_LIVEKIT_URL: wss://ci.livekit.cloud
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Build dashboard (Next.js standalone)
        run: bunx nx build dashboard

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/dashboard/Dockerfile
          push: false
          tags: memora-dashboard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max